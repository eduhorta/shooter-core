<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101727">
    <meta name="description" content="Um protótipo mobile de arqueiro e sobrevivência.">
    <title>Shooter Core</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Shooter Core">
      <header class="topbar">
        <div>
          <p class="eyebrow">ARQUEIRO • SOBREVIVÊNCIA</p>
          <h1>Shooter Core</h1>
        </div>
        <div class="score" aria-live="polite">
          <span class="score-label">ALVOS</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section class="game-stage" aria-label="Área do jogo">
        <canvas id="game" aria-label="Jogo de arqueiro. Arraste para mirar e solte para atirar."></canvas>
        <div class="stage-hint" id="hint">Arraste para mirar · solte para atirar</div>
      </section>

      <footer class="controls">
        <span class="control-icon" aria-hidden="true">↗</span>
        <p>Mire para cima e ajuste a força pelo comprimento do arrasto.</p>
      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
